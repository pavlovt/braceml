name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Opens a "Version Packages" PR when changesets exist; publishes to npm when that PR is merged,
      # then pushes the git tags and creates the GitHub releases.
      # v2 is the action for @changesets/cli v3; v1 can't read v3's publish output, so it skipped
      # the tags and releases for 0.4.0.
      - uses: changesets/action@v2
        with:
          publish-script: pnpm release
          create-github-releases: true
        env:
          # setup-node's .npmrc reads this variable; changesets/action v2 ignores NPM_TOKEN
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
